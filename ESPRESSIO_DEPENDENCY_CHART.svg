<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.node{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:15px;font-weight:600;text-anchor:middle}.small{font-size:13px;text-anchor:middle}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text class="title" x="35" y="45">ESPressio Command — primitives_redesign direct dependencies</text><rect class="node" x="500" y="85" width="180" height="62" rx="8"/><text class="label" x="590" y="117">Command</text><rect class="node" x="40" y="255" width="140" height="58" rx="8"/><text class="label" x="110" y="289">System</text><rect class="node" x="200" y="255" width="140" height="58" rx="8"/><text class="label" x="270" y="289">Primitive</text><rect class="node" x="360" y="255" width="140" height="58" rx="8"/><text class="label" x="430" y="289">Task</text><rect class="node" x="520" y="255" width="140" height="58" rx="8"/><text class="label" x="590" y="289">Threads</text><rect class="node" x="680" y="255" width="140" height="58" rx="8"/><text class="label" x="750" y="289">Timing</text><rect class="node" x="840" y="255" width="140" height="58" rx="8"/><text class="label" x="910" y="289">Serializable</text><rect class="node" x="1000" y="255" width="140" height="58" rx="8"/><text class="label" x="1070" y="289">Persistence</text><path class="edge" d="M550 147 L110 255"/><path class="edge" d="M565 147 L270 255"/><path class="edge" d="M578 147 L430 255"/><path class="edge" d="M590 147 L590 255"/><path class="edge" d="M602 147 L750 255"/><path class="edge" d="M615 147 L910 255"/><path class="edge" d="M630 147 L1070 255"/><text class="small" x="590" y="400">No direct Event, Observable, ArduinoJson, Mesh, Radio, State, Sockets or concrete transport dependency.</text><text class="small" x="590" y="435">Adapter-facing transport bindings preserve Command family semantics without owning physical routing or retry workers.</text><text class="small" x="590" y="500">Additional CI checkouts may satisfy transitive dependencies of the seven direct libraries and do not add Command edges.</text></svg>
