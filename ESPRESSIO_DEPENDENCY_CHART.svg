<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.node{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:15px;font-weight:600;text-anchor:middle}.small{font-size:12px;text-anchor:middle}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.optional{stroke-dasharray:7 6}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text class="title" x="35" y="45">ESPressio Current Released Generation — Command</text><rect class="node" x="80" y="110" width="180" height="62" rx="8"/><text class="label" x="170" y="142">Observable</text><rect class="node" x="410" y="110" width="180" height="62" rx="8"/><text class="label" x="500" y="142">Command</text><path class="edge" d="M410 141 L260 141"/><rect class="node" x="410" y="270" width="180" height="62" rx="8"/><text class="label" x="500" y="302">Event</text><path class="edge optional" d="M500 172 L500 270"/><rect class="node" x="120" y="430" width="180" height="62" rx="8"/><text class="label" x="210" y="462">Sockets</text><rect class="node" x="410" y="430" width="180" height="62" rx="8"/><text class="label" x="500" y="462">ESP-Now</text><rect class="node" x="700" y="430" width="180" height="62" rx="8"/><text class="label" x="790" y="462">WiFi</text><text class="small" x="500" y="535">Final cascade also includes Security, Persistence and terminal Serial.</text><text class="small" x="500" y="565">Command → Event is opt-in; Event has no reverse dependency on Command.</text></svg>
