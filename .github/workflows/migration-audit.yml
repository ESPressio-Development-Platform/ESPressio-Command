name: Migration Residual Audit

on:
  push:
    branches:
      - maintenance/15-repository-migration

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/15-repository-migration
      - name: Audit legacy references
        shell: bash
        run: |
          matches=$(grep -R -n -i 'flowduino' . --exclude-dir=.git --exclude=CHANGELOG.md --exclude=migration-audit.yml || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
      - name: Remove one-shot audit workflow
        run: |
          rm .github/workflows/migration-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed migration audit workflow'
          git push
