name: Command 0.2.0 Collision Safety
on:
  push:
    branches: [main]
    paths: ['.github/workflows/command-020-collision.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ESPressio_Command.hpp'); s=p.read_text()
          old='''    CommandRegistrationHandle RegisterCommand(std::string name) {\n        root_.Command(name);\n        return CommandRegistrationHandle(this, {std::move(name)});\n    }'''
          new='''    CommandRegistrationHandle RegisterCommand(std::string name) {\n        if (name.empty()) return {};\n        for (const auto& child : root_.children_) if (child->Matches(name)) return {};\n        root_.Command(name);\n        return CommandRegistrationHandle(this, {std::move(name)});\n    }'''
          if old not in s: raise SystemExit('RegisterCommand pattern missing')
          p.write_text(s.replace(old,new,1))
          t=Path('tests/test_command.cpp'); ts=t.read_text()
          ts=ts.replace('''        auto registration = registry.RegisterCommand("temporary");\n        registration.Active();''','''        auto registration = registry.RegisterCommand("temporary");\n        assert(registration.Active());\n        auto duplicate = registry.RegisterCommand("temporary");\n        assert(!duplicate.Active());''',1)
          t.write_text(ts)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/ESPressio_Command.hpp tests/test_command.cpp
          git commit -m "fix: preserve ownership of existing command roots"
          git push origin HEAD:main
