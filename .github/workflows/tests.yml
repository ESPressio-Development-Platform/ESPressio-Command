name: Tests
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core Command remains Event-free
        run: |
          if grep -R -nE '#[[:space:]]*include[[:space:]]*[<\"]ESPressio_(Event|CommandEvents|CommandRegistryEventBridge)' src/ESPressio_Command.hpp src/ESPressio_Commands.hpp; then exit 1; fi
      - name: Verify core Command remains JSON-adapter-free
        run: |
          if grep -R -nE '#[[:space:]]*include[[:space:]]*[<\"](ArduinoJson|ESPressio_JsonCommandInterpreter)' src/ESPressio_Command.hpp src/ESPressio_Commands.hpp; then exit 1; fi
      - run: cmake -S tests -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  esp32-json-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: project/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: structural_realignment, path: project/dependencies/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: structural_realignment, path: project/dependencies/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: structural_realignment, path: project/dependencies/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: structural_realignment, path: project/dependencies/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: structural_realignment, path: project/dependencies/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: structural_realignment, path: project/dependencies/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: structural_realignment, path: project/dependencies/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: structural_realignment, path: project/dependencies/ESPressio-Event}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Build JSON integration
        shell: bash
        run: |
          mkdir -p project/compile-json/src
          cat > project/compile-json/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -fno-rtti
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              bblanchon/ArduinoJson@^7.4.3
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../ESPressio-Command
          EOF
          cat > project/compile-json/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Command.hpp>
          #include <ESPressio_JsonCommandInterpreter.hpp>
          ESPressio::Command::CommandRegistry registry;
          ESPressio::Command::JsonCommandInterpreter json(registry);
          void setup(){ auto& c=registry.Command("gpio").Command("write"); c.Parameter<int>("pin"); c.OnExecute([](const ESPressio::Command::CommandContext&){return ESPressio::Command::CommandResult::Ok();}); }
          void loop(){}
          EOF
          pio run -d project/compile-json

  esp32-event-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: project/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: structural_realignment, path: project/dependencies/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: structural_realignment, path: project/dependencies/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: structural_realignment, path: project/dependencies/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: structural_realignment, path: project/dependencies/ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: structural_realignment, path: project/dependencies/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: structural_realignment, path: project/dependencies/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: structural_realignment, path: project/dependencies/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: structural_realignment, path: project/dependencies/ESPressio-Event}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Build Event integration
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -fno-rtti
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../ESPressio-Command
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Command.hpp>
          #include <ESPressio_CommandEvents.hpp>
          #include <ESPressio_CommandRegistryEventBridge.hpp>
          void setup(){ESPressio::Event::CommandRegistryEventBridge::GetInstance().Initialize();}
          void loop(){}
          EOF
          pio run -d project/compile
