name: Bootstrap Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch friendship
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ESPressio_Command.hpp')
          s=p.read_text()
          s=s.replace('struct CommandInvocation {', 'class CommandParameter;\n\nstruct CommandInvocation {', 1)
          s=s.replace('    friend class CommandRegistry;\n', '    friend class CommandRegistry;\n    friend class CommandParameter;\n', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/ESPressio_Command.hpp
          git commit -m "fix: allow parameter validation to use typed conversion"
          git push origin HEAD:main
