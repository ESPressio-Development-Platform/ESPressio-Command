name: Repository Migration Fixups

on:
  push:
    branches:
      - maintenance/15-repository-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/15-repository-migration
      - name: Apply migration replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'Flowduino ESPressio Development Platform': 'ESPressio Development Platform',
              'flowduino/ESPressio-Command': 'espressio-development-platform/ESPressio-Command',
              'flowduino/ESPressio-Event': 'espressio-development-platform/ESPressio-Event',
              'https://github.com/Flowduino/ESPressio-Command.git': 'https://github.com/ESPressio-Development-Platform/ESPressio-Command.git',
              'https://github.com/Flowduino/ESPressio-Command': 'https://github.com/ESPressio-Development-Platform/ESPressio-Command',
              'ESP-Now       0.7.0': 'ESP-Now       0.8.0',
              'ESP-Now 0.7.0': 'ESP-Now 0.8.0',
              'Serial        0.7.1': 'Serial        0.7.2',
              'Serial 0.7.1': 'Serial 0.7.2',
              'ESP-Now >= 0.7.0 < 1.0.0': 'ESP-Now >= 0.8.0 < 1.0.0',
          }

          for name in ('README.md', 'ESPRESSIO_DEPENDENCY_CHART.md', 'ESPRESSIO_DEPENDENCY_CHART.svg'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)

          png = Path('ESPRESSIO_DEPENDENCY_CHART.png')
          if png.exists():
              png.unlink()

          Path('.github/workflows/migration-fixups.yml').unlink()
          PY
      - name: Commit fixups
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Complete repository migration references'
          git push
