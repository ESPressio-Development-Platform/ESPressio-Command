name: Prepare Command 1.0.1 release
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'release/24-1.0.1-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/24-1.0.1-repository-relocation
      - name: Prepare release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          t=t.replace('## Current Version — 1.0.0','## Current Version — 1.0.1',1)
          t=t.replace('Command 1.0.0 adds a representation-neutral typed `CommandValue`/`CommandInvocation` model, an explicit text interpreter and an optional JSON interpreter with structured results and machine-readable Command discovery.','Command 1.0.1 is the repository-relocation dependency patch for the Command 1.0 generation. It preserves the representation-neutral typed invocation model and existing runtime behaviour.',1)
          t=t.replace('ESPressio Observable >= 3.0.1 < 4.0.0','ESPressio Observable >= 3.0.2 < 4.0.0')
          t=t.replace('ESPressio Event >= 6.0.0 < 7.0.0','ESPressio Event >= 6.0.1 < 7.0.0')
          t=t.replace('espressio-development-platform/ESPressio-Command@^1.0.0','espressio-development-platform/ESPressio-Command@^1.0.1')
          t=t.replace('ESPressio-Observable@^3.0.1','ESPressio-Observable@^3.0.2')
          t=t.replace('ESPressio-Event@^6.0.0','ESPressio-Event@^6.0.1')
          p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text(); entry='''## 1.0.1 — 2026-08-22\n\n### Changed\n- Published the post-migration ESPressio Command package generation from `ESPressio-Development-Platform`.\n- Raised required ESPressio Observable to `>=3.0.2 <4.0.0`.\n- Raised optional ESPressio Event integration to `>=6.0.1 <7.0.0`.\n- Updated package metadata, README dependency/install guidance, CI validation, and dependency documentation.\n\n### Compatibility\n- No Command public API or runtime behaviour changes are introduced by this repository-relocation patch release.\n\n''';
          if '## 1.0.1' not in t: t=t.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(t)
          reps=[('Observable    3.0.1','Observable    3.0.2'),('Observable 3.0.1','Observable 3.0.2'),('Serializable  0.10.2','Serializable  0.10.3'),('Serializable 0.10.2','Serializable 0.10.3'),('Units         0.2.3','Units         0.2.4'),('Units 0.2.3','Units 0.2.4'),('Timing        2.2.4','Timing        2.2.5'),('Timing 2.2.4','Timing 2.2.5'),('Threads       3.1.4','Threads       3.1.5'),('Threads 3.1.4','Threads 3.1.5'),('Event         6.0.0','Event         6.0.1'),('Event 6.0.0','Event 6.0.1'),('Command       1.0.0','Command       1.0.1'),('Command 1.0.0','Command 1.0.1'),('Observable >= 3.0.1','Observable >= 3.0.2'),('Event >= 6.0.0','Event >= 6.0.1')]
          for f in ['ESPRESSIO_DEPENDENCY_CHART.md','ESPRESSIO_DEPENDENCY_CHART.svg']:
              p=Path(f); t=p.read_text()
              for a,b in reps: t=t.replace(a,b)
              p.write_text(t)
          PY
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md ESPRESSIO_DEPENDENCY_CHART.md ESPRESSIO_DEPENDENCY_CHART.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Command 1.0.1 release documentation (#24)'
          git push
